<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Setup 2FA</title>
</head>
<body>

<h1>Setup Two-Factor Authentication</h1>

<p>Scan this QR code with Microsoft Authenticator, Google Authenticator or another authenticator app.</p>

<div>
    <img th:src="'data:image/png;base64,' + ${qrCode}" alt="QR Code">
</div>

<p>After scanning the QR code, you can log in using your email, password and authenticator code.</p>

<a th:href="@{/login}">Go to login</a>

</body>
</html>
